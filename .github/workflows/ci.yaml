name: CI
on:
  push:

env:
  DOCKER_IMAGE: ghcr.io/ingenerator/ingenerator-php:8.4
  PHP_VERSION: 8.4

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        tools: composer:v2

    - name: Checkout
      uses: actions/checkout@v2

    - name: Composer install
      uses: ingenerator/github-composite-actions/cached-composer-install@v1

    - name: Pull docker image
      uses: ingenerator/github-composite-actions/auth-and-pull-from-ghcr@v1
      with:
        github_password: ${{ secrets.GITHUB_TOKEN }}
        image: ${{ env.DOCKER_IMAGE }}

    - name: Unit tests
      run: |
        docker run --rm \
        -v $PWD:/var/www \
        --entrypoint vendor/bin/phpunit \
        ${{ env.DOCKER_IMAGE }}
